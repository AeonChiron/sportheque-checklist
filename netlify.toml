# Hébergement Netlify (gratuit) : site statique + une fonction (comptes, historique, signalements).
# Variables à ajouter dans Netlify : EMPLOYEE_CODE, SUPERVISOR_CODE et ADMIN_CODE.
[build]
  publish = "."
  functions = "netlify/functions"
  # Le site se met à jour sur GitHub Pages à chaque changement. Netlify ne
  # republie que si le message du commit contient [netlify] (économise les
  # crédits). Le serveur (comptes, historique) reste en ligne sur Netlify.
  ignore = "git log -1 --pretty=%B | grep -qF '[netlify]' && exit 1 || exit 0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Outil interne : jamais dans les moteurs de recherche.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
