# Hébergement Netlify (gratuit) : site statique + une fonction (comptes, historique, signalements).
# Variables à ajouter dans Netlify : TEAM_CODE (code d’équipe) et BOSS_CODE (code superviseur).
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Outil interne : jamais dans les moteurs de recherche.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
