<body>
  <!-- Fond vivant : lumière de piscine, très lente. -->
  <div class="env" aria-hidden="true"><i></i></div>

  <main id="app">
  <!-- 0. Connexion (une fois : le téléphone s'en souvient) -->
  <!-- Barre rapide : suit l'employé sur chaque écran (déplacée par app.js). -->
  <div class="quick-bar" id="quickBar" hidden>
    <div class="qb-left">
      <button type="button" class="quick-btn qb-back" data-front><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span></span></button>
      <button type="button" class="quick-btn" id="qbTasks" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg><span data-t="myTasks"></span></button>
      <button type="button" class="quick-btn" id="restartBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg><span data-t="restartShort"></span></button>
      <button type="button" class="quick-btn qb-boss" id="qbBoss" data-go="boss" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-t="bossMode"></span></button>
      <button type="button" class="quick-btn qb-acct" id="qbAccount" data-account data-label="account" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></button>
      <button type="button" class="quick-btn qb-visit" id="qbVisit" hidden><span data-t="visitorMode"></span><b data-t="visitorExit"></b></button>
    </div>
    <div class="qb-tools">
      <button type="button" class="theme-btn gear-btn" data-settings data-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </div>

  <button type="button" class="fict-exit" id="fictExit" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span><b data-t="fictExit"></b><small data-t="fictExitSub"></small></span></button>
  <!-- La barre du bas (téléphone) / le rail de côté (ordinateur) : propriétaire, 25 oct. -->
  <nav class="tabbar" id="tabBar" aria-label="Navigation" hidden></nav>
  <section id="auth" class="screen pool-screen" hidden>
    <!-- Le plancher de gym fraîchement lavé (dessiné en code, js/pool.js) -->
    <div class="pool" id="pool" aria-hidden="true">
      <canvas></canvas>
      <div class="mascot-float"><img src="icons/rabbit.svg" alt="" draggable="false"></div>
    </div>
    <div class="pool-ui">
      <div class="pool-top">
        <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <div class="setup-tools">
          <button type="button" class="theme-btn gear-btn" data-settings data-label="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button type="button" class="acct-btn" id="poolAccount" data-account hidden></button>
        </div>
      </div>
      <div class="pool-head">
        <h1><span class="pool-gym" id="poolGym"></span><span class="pool-app" data-t="appTitle"></span></h1>
      </div>
      <div class="pool-bottom">
        <p class="pool-cheer"><strong data-t="thanksTeam"></strong><span id="poolCheer"></span></p>
        <button type="button" class="pool-cta" id="poolStart"><span class="bb-plates l" aria-hidden="true"><i></i><i></i></span><span id="poolStartLabel"></span><span class="bb-plates r" aria-hidden="true"><i></i><i></i></span><span class="next-box wb-strip" id="poolNext" hidden></span></button>
        <nav class="pool-dash" id="poolDash" hidden>

      <h1 data-t="bossSpace"></h1>
    </header>
    <div id="bossBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 10. Affiche à imprimer : le chemin vers le site (QR) -->
  <section id="poster" class="screen" hidden>
    <header class="review-top no-print">
      <div class="review-nav"><button class="back" data-go="boss-keep">‹ <span data-t="bossSpace"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
    </header>
    <div class="poster">
      <div class="brand poster-brand" data-brand></div>
      <h1 data-t="posterTitle"></h1>
      <p class="lede" data-t="posterLede"></p>
      <div class="poster-qr" id="posterQr"></div>
      <p class="poster-url num" id="posterUrl"></p>
      <ol class="poster-steps">
        <li data-t="posterStep1"></li>
        <li data-t="posterStep2"></li>
        <li><span data-t="posterStep3"></span> <span class="poster-blank">____________</span></li>
      </ol>
    </div>
    <button class="btn primary big no-print" type="button" id="posterPrint" data-t="posterPrint"></button>
    <p class="section-note no-print" data-t="posterNote"></p>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- La fiche d'un employé (superviseurs seulement) -->
  <section id="person" class="screen sub-page" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="boss-keep">‹ <span data-t="bossSpace"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
    </header>
    <div id="personBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- Préférences : tout ce qu'on peut régler, au même endroit -->
  <section id="prefs" class="screen sub-page" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="hub">‹ <span data-t="hubBack"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
      <span class="hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></span>
      <p class="eyebrow" id="prefsEyebrow"></p>
      <h1 data-t="prefsTitle"></h1>
    </header>
    <div id="prefsBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 9. Un signalement (ouvert depuis le courriel) -->
  <section id="problem" class="screen" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="boss-keep">‹ <span data-t="bossSpace"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
    </header>
    <div id="problemBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <button type="button" class="shift-pill" id="shiftPill" hidden>
    <span class="sp-ring" aria-hidden="true"></span>
    <span data-t="myTasks"></span><b class="num"></b>
  </button>
  </main>

  <!-- Feuille du bas (détails, signalement, options) -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <button type="button" class="sheet-x" id="sheetX" data-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot" hidden></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="burst" id="burst" aria-hidden="true"></div>

  <script type="module" src="js/boot.js"></script>
</body>
</html>
