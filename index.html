<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quart gym">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Quart gym</title>
</head>
<body>
  <!-- 1. Début de quart -->
  <section id="setup" class="screen" hidden>
    <div class="setup-top">
      <p class="brand"><span class="brand-dot" aria-hidden="true"></span><span id="brandLine"></span></p>
      <div class="lang-switch" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>

    <header class="hero">
      <h1 data-t="hello"></h1>
      <p class="lede" data-t="lede"></p>
    </header>

    <form id="setupForm" class="panel form" autocomplete="on" novalidate>
      <label class="field">
        <span data-t="name"></span>
        <input id="fName" name="name" type="text" autocomplete="given-name" autocapitalize="words" data-ph="namePh" required>
      </label>
      <div class="row2">
        <label class="field">
          <span data-t="start"></span>
          <input id="fStart" name="start" type="time" required>
        </label>
        <label class="field">
          <span data-t="end"></span>
          <input id="fEnd" name="end" type="time" required>
        </label>
      </div>
      <label class="field">
        <span data-t="date"></span>
        <input id="fDate" name="date" type="date" required>
      </label>
      <div class="field-group">
        <label class="field">
          <span data-t="supervisor"></span>
          <input id="fSupervisor" name="supervisor" type="text" autocapitalize="words" list="supervisorList" data-ph="supervisorPh">
          <datalist id="supervisorList"></datalist>
        </label>
        <div class="inline-choice">
          <span data-t="reportLang"></span>
          <div class="segmented tiny" role="radiogroup" id="reportLang">
            <button type="button" role="radio" data-rlang="fr">Français</button>
            <button type="button" role="radio" data-rlang="en">English</button>
          </div>
        </div>
      </div>

      <div id="preview" class="preview" aria-live="polite"></div>
      <button class="btn primary big" type="submit" data-t="create"></button>
    </form>
    <p class="fineprint" id="manualVersion"></p>
  </section>

  <!-- 2. Checklist -->
  <section id="checklist" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-id">
          <p class="eyebrow" id="cEyebrow"></p>
          <h2 id="cTitle"></h2>
        </div>
        <button class="icon-btn" id="menuBtn" aria-label="Options">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
      <div class="timeline" id="timeline" aria-hidden="true"></div>
      <div class="timeline-legend">
        <span id="progressLabel"></span>
        <span class="mono" id="rangeLabel"></span>
      </div>
    </header>

    <div id="nowCard"></div>
    <div class="daystrip" id="dayStrip"></div>

    <div class="segmented view-toggle" role="tablist">
      <button type="button" role="tab" data-view="time" data-t="byTime"></button>
      <button type="button" role="tab" data-view="zone" data-t="byZone"></button>
    </div>

    <ol class="tasks" id="taskList"></ol>
    <div id="overflowBlock"></div>
    <div id="flagsBlock"></div>
    <div class="bottom-spacer"></div>

    <nav class="bottombar">
      <button class="btn flag" id="flagBtn"><span aria-hidden="true">⚑</span> <span data-t="flag"></span></button>
      <button class="btn primary" id="finishBtn" data-t="finish"></button>
    </nav>
  </section>

  <!-- 3. Fin de quart -->
  <section id="finish" class="screen" hidden>
    <header class="topbar plain">
      <button class="back" id="backBtn">‹ <span data-t="back"></span></button>
      <h2 data-t="endTitle"></h2>
    </header>
    <div id="finishSummary"></div>
    <div class="panel">
      <label class="field">
        <span data-t="notes"></span>
        <textarea id="fNotes" rows="4" data-ph="notesPh"></textarea>
      </label>
    </div>
    <div id="sendError"></div>
    <div class="bottom-spacer"></div>
    <nav class="bottombar">
      <button class="btn primary big" id="sendBtn"></button>
    </nav>
  </section>

  <!-- 4. Envoyé -->
  <section id="sent" class="screen center" hidden>
    <div class="done-badge" aria-hidden="true">✓</div>
    <h2 data-t="sentTitle"></h2>
    <p class="lede" id="sentText"></p>
    <button class="btn primary big" id="newShiftBtn" data-t="newShift"></button>
    <div class="email-preview" id="emailPreview" hidden></div>
  </section>

  <!-- Feuille du bas (détails, signalement, options) -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
