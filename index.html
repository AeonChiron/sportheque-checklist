<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quart gym">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Checklist de quart de l’équipe d’entretien du gym, 2e étage.">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/saira-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>try{var p=JSON.parse(localStorage.getItem('gym-shift-prefs'))||{};document.documentElement.dataset.theme=p.theme==='dark'||(p.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
  <title>Quart gym</title>
</head>
<body>
  <!-- Fond vivant : lumière de piscine, très lente. -->
  <div class="env" aria-hidden="true"><i></i></div>

  <main id="app">
  <!-- 0. Connexion (une fois : le téléphone s'en souvient) -->
  <section id="auth" class="screen" hidden>
    <div class="setup-top">
      <div class="brand" data-brand></div>
      <div class="setup-tools">
        <button type="button" class="theme-btn" data-theme-btn aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="tmask2"><rect width="24" height="24" fill="#fff"/><circle class="tm-bite" cx="30" cy="4" r="7.5" fill="#000"/></mask></defs><g mask="url(#tmask2)"><circle class="tm-core" cx="12" cy="12" r="5"/></g><g class="tm-rays"><path d="M12 1.8v2.4M12 19.8v2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g></svg>
        </button>
                <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
    <header class="hero">
      <h1 data-t="welcome"></h1>
      <p class="lede" data-t="authLede"></p>
    </header>
    <div class="notice ok auth-context" id="authContext" hidden></div>
    <div class="segmented auth-tabs" role="tablist">
      <button type="button" role="tab" data-authtab="login" aria-selected="true" data-t="login"></button>
      <button type="button" role="tab" data-authtab="signup" aria-selected="false" data-t="signup"></button>
    </div>
    <form id="authForm" class="panel form" novalidate>
      <label class="field" data-only="signup">
        <span data-t="name"></span>
        <input id="aName" type="text" autocomplete="given-name" autocapitalize="words" data-ph="namePh">
      </label>
      <label class="field">
        <span data-t="email"></span>
        <input id="aEmail" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" data-ph="emailPh">
      </label>
      <label class="field">
        <span data-t="password"></span>
        <span class="pw-wrap"><input id="aPass" type="password" autocomplete="current-password" minlength="6"><button type="button" class="link pw-eye" id="aShow" data-t="show"></button></span>
      </label>
      <div class="field" data-only="signup">
        <span data-t="iAm"></span>
        <div class="segmented" role="radiogroup" id="aRole">
          <button type="button" role="radio" data-role="employee" aria-checked="true" data-t="roleEmployee"></button>
          <button type="button" role="radio" data-role="boss" aria-checked="false" data-t="roleBoss"></button>
        </div>
      </div>
      <label class="field" data-only="signup">
        <span id="aCodeLabel"></span>
        <input id="aCode" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <small class="hint" id="aCodeHint"></small>
      </label>
      <label class="check-line"><input type="checkbox" id="aRemember" checked><span data-t="remember"></span></label>
      <div id="authError" aria-live="polite"></div>
      <button class="btn primary big" type="submit" id="authSubmit"></button>
    </form>
    <p class="fineprint" id="authNote"></p>
    <p class="auth-forgot" id="authForgot" data-t="forgotHelp"></p>
  </section>

  <!-- 1. Début de quart -->
  <section id="setup" class="screen" hidden>
    <div class="setup-top">
      <div class="brand" id="brand"></div>
      <div class="setup-tools">
        <button type="button" class="theme-btn" data-theme-btn aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="tmask1"><rect width="24" height="24" fill="#fff"/><circle class="tm-bite" cx="30" cy="4" r="7.5" fill="#000"/></mask></defs><g mask="url(#tmask1)"><circle class="tm-core" cx="12" cy="12" r="5"/></g><g class="tm-rays"><path d="M12 1.8v2.4M12 19.8v2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g></svg>
        </button>
        <button type="button" class="aa-btn" data-large aria-pressed="false" data-label="largeText"><span class="aa-s">A</span><span class="aa-l">A</span></button>
        <div class="lang-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <header class="hero">
      <h1 data-t="hello"></h1>
      <p class="lede" data-t="lede"></p>
      <p class="account-line" id="accountLine" hidden></p>
    </header>
    <div class="install-tip" id="installTip" hidden></div>
    <button class="btn ghost big edit-today" type="button" id="editToday" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span></span>
    </button>

    <form id="setupForm" class="panel form" autocomplete="on" novalidate>
      <label class="field" id="nameField">
        <span data-t="name"></span>
        <input id="fName" name="name" type="text" autocomplete="given-name" autocapitalize="words" data-ph="namePh" required>
      </label>
      <div class="field">
        <span data-t="yourHours"></span>
        <div class="presets" role="radiogroup" id="presetPick"></div>
      </div>
      <button type="button" class="link more-hours" id="moreHours" data-t="moreHours"></button>
      <div class="row2" id="timeRow" hidden>
        <label class="field">
          <span data-t="start"></span>
          <input id="fStart" name="start" type="time" required>
        </label>
        <label class="field">
          <span data-t="end"></span>
          <input id="fEnd" name="end" type="time" required>
        </label>
      </div>
      <div class="field">
        <span data-t="date"></span>
        <div class="date-line"><b id="dateText"></b><button type="button" class="link" id="dateChange" data-t="changeDate"></button></div>
        <input id="fDate" name="date" type="date" required hidden aria-label="Date">
      </div>

      <div id="preview" class="preview" aria-live="polite"></div>
      <button class="btn primary big" type="submit" data-t="create"></button>
    </form>

    <div class="home-links">
      <button class="btn overview-link hist-link boss-link" type="button" data-go="boss" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
        <span data-t="bossSpace"></span><span class="count num" id="bossCount" hidden></span>
      </button>
      <button class="btn flag overview-link hist-link flag-home" type="button" id="flagHome" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
        <span data-t="reportProblem"></span>
      </button>
      <button class="btn ghost overview-link hist-link" type="button" data-go="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4.5h4.5M12 7.5V12l3 2"/></svg>
        <span data-t="history"></span>
      </button>
      <button class="btn ghost overview-link" type="button" data-go="apercu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
        <span data-t="overviewShort"></span>
      </button>
      <button class="btn ghost overview-link" type="button" data-go="protocol">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6M9 11h4"/></svg>
        <span data-t="protocol"></span>
      </button>
    </div>
    <p class="fineprint" id="manualVersion"></p>
  </section>

  <!-- 2. Checklist -->
  <section id="checklist" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <span class="mark" data-mark aria-hidden="true"></span>
        <div class="topbar-id">
          <p class="eyebrow" id="cEyebrow"></p>
          <h1 id="cTitle"></h1>
        </div>
        <div class="topbar-actions">
          <button class="pill-btn" type="button" data-go="apercu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
            <span data-t="overviewShort"></span>
          </button>
          <button class="pill-btn" type="button" id="menuBtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            <span data-t="menu"></span>
          </button>
        </div>
      </div>
      <div class="lane" id="timeline" aria-hidden="true"></div>
      <div class="timeline-legend">
        <span id="progressLabel"></span>
        <span class="num" id="rangeLabel"></span>
      </div>
    </header>

    <div id="nowCard"></div>
    <div class="list-head"><h2 data-t="yourTasks"></h2><span class="num" id="listCount"></span></div>
    <p class="hint" id="swipeHint" hidden></p>

    <ol class="tasks" id="taskList"></ol>
    <div id="overflowBlock"></div>
    <div id="flagsBlock"></div>
    <div class="bottom-spacer"></div>

    <nav class="bottombar">
      <button class="btn flag" id="flagBtn"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span data-t="flag"></span></button>
      <button class="btn primary" id="finishBtn" data-t="finish"></button>
    </nav>
  </section>

  <!-- 3. Fin de quart -->
  <section id="finish" class="screen" hidden>
    <header class="topbar plain">
      <button class="back" id="backBtn">‹ <span data-t="back"></span></button>
      <h1 data-t="endTitle"></h1>
    </header>
    <div id="finishSummary"></div>
    <div class="panel">
      <label class="field">
        <span data-t="notes"></span>
        <textarea id="fNotes" rows="4" data-ph="notesPh"></textarea>
      </label>
    </div>
    <p class="section-note save-note" data-t="saveNote"></p>
    <div class="bottom-spacer"></div>
    <nav class="bottombar">
      <button class="btn primary big" id="sendBtn"></button>
    </nav>
  </section>

  <!-- 4. Quart enregistré -->
  <section id="sent" class="screen center" hidden>
    <div class="done-badge" aria-hidden="true">✓</div>
    <h1 data-t="savedTitle"></h1>
    <p class="lede" id="sentText"></p>
    <p class="win-line" id="sentWin"></p>
    <button class="btn primary big" id="newShiftBtn" data-t="newShift"></button>
    <button class="btn ghost big" type="button" data-go="history" data-t="seeHistory"></button>
    <button class="link edit-shift" type="button" id="editShiftBtn" data-t="editMine" hidden></button>
  </section>

  <!-- 5. Un quart en détail (historique, Aperçu, ancien courriel) -->
  <section id="review" class="screen" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="home">‹ <span data-t="home"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
    </header>
    <div id="reviewBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 6. Aperçu du gym (pour toute l'équipe) -->
  <section id="apercu" class="screen" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="home">‹ <span data-t="home"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
      <p class="eyebrow" id="apEyebrow"></p>
      <h1 data-t="overview"></h1>
    </header>
    <div id="apercuBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 7. Historique des quarts (pour toute l'équipe) -->
  <section id="history" class="screen" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="home">‹ <span data-t="home"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
      <p class="eyebrow" id="hiEyebrow"></p>
      <h1 data-t="history"></h1>
    </header>
    <div id="historyBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 8. Espace superviseur : signalements et équipe -->
  <section id="boss" class="screen" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="home">‹ <span data-t="home"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
      <p class="eyebrow" id="bossEyebrow"></p>
      <h1 data-t="bossSpace"></h1>
    </header>
    <div id="bossBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 10. Affiche à imprimer : le chemin vers le site (QR) -->
  <section id="poster" class="screen" hidden>
    <header class="review-top no-print">
      <div class="review-nav"><button class="back" data-go="boss-keep">‹ <span data-t="bossSpace"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
    </header>
    <div class="poster">
      <div class="brand poster-brand" data-brand></div>
      <h1 data-t="posterTitle"></h1>
      <p class="lede" data-t="posterLede"></p>
      <div class="poster-qr" id="posterQr"></div>
      <p class="poster-url num" id="posterUrl"></p>
      <ol class="poster-steps">
        <li data-t="posterStep1"></li>
        <li data-t="posterStep2"></li>
        <li><span data-t="posterStep3"></span> <span class="poster-blank">____________</span></li>
      </ol>
    </div>
    <button class="btn primary big no-print" type="button" id="posterPrint" data-t="posterPrint"></button>
    <p class="section-note no-print" data-t="posterNote"></p>
    <div class="bottom-spacer small"></div>
  </section>

  <!-- 9. Un signalement (ouvert depuis le courriel) -->
  <section id="problem" class="screen" hidden>
    <header class="review-top">
      <div class="review-nav"><button class="back" data-go="boss-keep">‹ <span data-t="bossSpace"></span></button><span class="mark" data-mark aria-hidden="true"></span></div>
    </header>
    <div id="problemBody"></div>
    <div class="bottom-spacer small"></div>
  </section>

  <button type="button" class="shift-pill" id="shiftPill" hidden>
    <span class="sp-ring" aria-hidden="true"></span>
    <span data-t="myTasks"></span><b class="num"></b>
  </button>
  </main>

  <!-- Feuille du bas (détails, signalement, options) -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <button type="button" class="sheet-x" id="sheetX" data-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot" hidden></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="burst" id="burst" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
